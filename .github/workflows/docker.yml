name: "Docker"

on:
  workflow_dispatch:

  push:
    branches: ["master"]

  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

jobs:
  version:
    name: "Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read VERSION
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

  build:
    name: "Build"
    needs: version
    uses: dockette/.github/.github/workflows/docker.yml@master
    secrets: inherit
    with:
        image: "dockette/kumatron"
        tag: "${{ matrix.tag }}"
        context: "${{ matrix.context }}"
    strategy:
      matrix:
        include:
          - tag: latest
            context: .
          - tag: ${{ needs.version.outputs.version }}
            context: .
          - tag: 20250502
            context: .

      fail-fast: false

  release:
    name: "Release"
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$(cat VERSION)" || gh release create "$(cat VERSION)" --generate-notes

  docs:
    name: "Docs"
    needs: build
    if: github.ref == 'refs/heads/master'
    uses: dockette/.github/.github/workflows/dockerhub-description.yml@master
    secrets: inherit
    with:
      image: "dockette/kumatron"
